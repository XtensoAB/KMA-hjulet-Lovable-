name: Build and Deploy KMA-hjulet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          NITRO_PRESET: node-server
        run: npm run build

      - name: Verify output
        run: |
          pwd
          ls -la
          ls -la .output
          ls -la .output/server || true
          ls -la .output/public || true

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5A55D70831C7438BA3B9791C48A2C04B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_88C7FB145F1B4843877359A474336DBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5F6EE25E9FF448EAA9D6A22349BE04A1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: xtenso-kma-hjulet
          package: .output
