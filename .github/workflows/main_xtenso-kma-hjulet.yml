name: Build and deploy Node.js app to Azure Web App - xtenso-kma-hjulet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app for Azure App Service
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .output

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .output

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'xtenso-kma-hjulet'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2E5A0678FB7C4B1EAD68384E6F30D79F }}
          package: .output
