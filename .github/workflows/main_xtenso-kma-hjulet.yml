name: Build and deploy Node.js app to Azure Web App - xtenso-kma-hjulet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          NITRO_PRESET: node-server
        run: npm run build

      - name: Verify output
        run: |
          pwd
          ls -la
          ls -la .output
          ls -la .output/server || true
          ls -la .output/public || true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'xtenso-kma-hjulet'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2E5A0678FB7C4B1EAD68384E6F30D79F }}
          package: .output
