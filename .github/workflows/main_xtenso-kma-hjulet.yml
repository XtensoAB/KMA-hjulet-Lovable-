name: Build and deploy KMA-hjulet to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application for Node.js
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Verify deployment package
        shell: bash
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          echo "Nitro server and public files found"
          ls -la .output
          ls -la .output/server
          ls -la .output/public

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'xtenso-kma-hjulet'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2E5A0678FB7C4B1EAD68384E6F30D79F }}
          package: .output
