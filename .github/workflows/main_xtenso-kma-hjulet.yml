name: Build and deploy Node.js app to Azure Web App - xtenso-kma-hjulet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Verify build output
        run: |
          pwd
          ls -la
          ls -la .output
          find .output -type f | head -50

      - name: Upload artifact
        uses
